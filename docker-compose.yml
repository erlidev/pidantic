# GPU-only local services for this package.
#
#   docker compose up -d
#   curl http://localhost:8989/v1/models                     # Ling 3.0 Tiny
#
# The CPU-only SearXNG search service lives in docker-compose-cpu.yml (project `pidantic-cpu`)
# so each stack starts and stops independently.
#
# Ling is exposed on all host interfaces to preserve the original Docker port mapping.

name: pidantic

services:
  ling-tiny:
    image: vllm/vllm-openai:nightly
    container_name: ling-tiny
    restart: unless-stopped
    ipc: host
    ports:
      - "8989:8000"
    gpus: all
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
    command:
      - inclusionAI/Ling-3.0-tiny-int4
      - --trust-remote-code
      - --mamba-cache-mode
      - align
      - --max-model-len
      - "131072"
      - --kv-cache-memory
      - "2147483648"
      - --enable-auto-tool-choice
      - --tool-call-parser
      - ling3
      - --reasoning-parser
      - ling3
      - --enable-prefix-caching
      - --enable-chunked-prefill
      - --max-num-batched-tokens
      - "4096"
