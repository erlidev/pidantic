# Shared local services for extensions in this package.
#
#   docker compose up -d
#   curl 'http://localhost:8888/search?q=test&format=json'   # SearXNG: must return JSON, not 403
#   curl http://localhost:8787/health                        # reranker
#
# Both bind to loopback only: the SearXNG limiter is off and neither service has auth, so they
# must not be reachable off-host.

# Preserve the existing project identity after moving this file from the localsearch directory.
# The services are package-wide despite the legacy Docker names.
name: localsearch

services:
  # Primary web search provider. Aggregates Google, Bing and DuckDuckGo, and handles their
  # anti-bot measures properly — direct scraping of those engines does not work from here.
  searxng:
    image: searxng/searxng:latest
    container_name: localsearch-searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./docker/searxng-settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_BASE_URL=http://localhost:8888/
      # Override for a real secret if you ever expose this beyond loopback:
      #   echo "SEARXNG_SECRET=$(openssl rand -hex 32)" > .env
      - SEARXNG_SECRET=${SEARXNG_SECRET:-localsearch}
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    healthcheck:
      test: ["CMD", "wget", "-qO", "-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Cross-encoder that reranks the candidate pool down to the results the model sees.
  # Optional: if this is down, searches keep the provider's own ordering and still work.
  #
  # 22M parameters on CPU — ~90MB to download, ready in ~25s, ~110ms to rank a 30-result pool.
  # BAAI/bge-reranker-v2-m3 (568M) is stronger but needs a GPU: 16s for the same pool on CPU
  # here, 140x slower for no visible gain on short search snippets. See README for that path.
  reranker:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.3
    container_name: localsearch-reranker
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:80"
    volumes:
      - ./docker/reranker-data:/data
    command:
      - "--model-id"
      - "cross-encoder/ms-marco-MiniLM-L-6-v2"
      # The default (16384) makes CPU warmup take so long the server never reports ready.
      - "--max-batch-tokens"
      - "4096"
      - "--max-client-batch-size"
      - "64"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
