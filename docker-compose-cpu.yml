# CPU-only local services for this package.
#
#   docker compose -f docker-compose-cpu.yml up -d
#   curl 'http://localhost:8888/search?q=test&format=json'   # SearXNG: must return JSON, not 403
#
# SearXNG binds to loopback only: its limiter is off and it has no auth, so it must not be
# reachable off-host. The GPU-only Ling 3.0 Tiny service lives in docker-compose.yml (project
# `pidantic`).

name: pidantic-cpu

services:
  # Primary web search provider. Aggregates Google, Bing and DuckDuckGo, and handles their
  # anti-bot measures properly — direct scraping of those engines does not work from here.
  searxng:
    image: searxng/searxng:latest
    container_name: pidantic-searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./docker/searxng-settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_BASE_URL=http://localhost:8888/
      # Override for a real secret if you ever expose this beyond loopback:
      #   echo "SEARXNG_SECRET=$(openssl rand -hex 32)" > .env
      - SEARXNG_SECRET=${SEARXNG_SECRET:-pidantic}
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    healthcheck:
      test: ["CMD", "wget", "-qO", "-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
